version: '3.8'

services:
  api:
    build: .
    container_name: order-delivery-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
